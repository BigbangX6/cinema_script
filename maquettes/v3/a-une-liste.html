<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cinema Script · A · Une seule liste</title>
<meta name="oneapp-icon" content="🎬">
<style>
/* Proposition A : un seul écran. La liste se trie « Scénario » ou « Tournage » ; le clap n'est pas un mode,
   c'est une barre qui apparaît en haut quand on arme un plan (🎬). Un seul bouton « + ». */
:root {
  --bg: #111315; --panel: #1b1e21; --panel-2: #23272b; --line: #2e3338; --text: #f2f4f5; --muted: #8d969c;
  --accent: #50e3c2; --on-accent: #0b2b25; --blue: #4a90e2; --orange: #f5a623; --red: #e5484d;
  --av-master: #4caf50; --av-ok: #2196f3; --av-moyen: #ab47bc; --av-bof: #ff9800; --av-ko: #a1887f; --av-verif: #e91e63;
  --shadow: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eef1f3; --panel: #ffffff; --panel-2: #f4f6f8; --line: #dde2e6; --text: #15191c; --muted: #66727a; --on-accent: #0b2b25;
  --av-ko: #795548; --shadow: 0 10px 30px rgba(0,0,0,.15); color-scheme: light; } }
:root[data-theme="light"] { --bg: #eef1f3; --panel: #ffffff; --panel-2: #f4f6f8; --line: #dde2e6; --text: #15191c; --muted: #66727a; --av-ko: #795548; --shadow: 0 10px 30px rgba(0,0,0,.15); color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cs-dragging, .cs-dragging * { user-select: none; -webkit-user-select: none; cursor: grabbing !important; }
.wrap { max-width: 820px; margin: 0 auto; padding: 0 14px 140px; }

/* En-tête collé : projet, tri, barre de clap */
.stick { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-top: 10px; }
.top { display: flex; align-items: center; gap: 8px; }
.brand { flex: 1; min-width: 0; font-weight: 700; font-size: 1.1rem; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ic { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-size: 1.1rem; }
.ic.on { border-color: var(--accent); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin: 10px 0; }
.seg button { border: none; background: none; padding: 10px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--blue); color: #fff; }
.search { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin-bottom: 10px; }
.search input { padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.search small { color: var(--muted); }

.slate { background: var(--panel); border: 2px solid var(--accent); border-radius: 14px; padding: 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-bottom: 10px; box-shadow: var(--shadow); }
.slate.impro { border-color: var(--orange); }
.sl-top { display: flex; align-items: center; gap: 10px; }
.sl-code { font-weight: 800; font-size: 1.15rem; color: var(--accent); white-space: nowrap; }
.sl-take { font-weight: 800; font-size: 1.15rem; white-space: nowrap; }
.sl-text { flex: 1; min-width: 0; color: var(--muted); font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sl-x { width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--panel-2); }
.sl-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.clap { border: none; border-radius: 10px; background: var(--blue); color: #fff; font-weight: 800; padding: 0 18px; font-size: 1.05rem; }
.clap:active { transform: scale(.97); }
.sl-row input { min-width: 0; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); }
.avis6 { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.av { --av: var(--muted); border: 2px solid var(--av); background: var(--panel-2); border-radius: 10px; display: grid; justify-items: center; padding: 6px 0; min-height: 52px; }
.av span { font-size: 1.25rem; line-height: 1.1; }
.av b { font-size: .68rem; color: var(--av); }
.av:active { background: var(--av); }
.k-master { --av: var(--av-master); } .k-ok { --av: var(--av-ok); } .k-moyen { --av: var(--av-moyen); }
.k-bof { --av: var(--av-bof); } .k-ko { --av: var(--av-ko); } .k-verif { --av: var(--av-verif); }

/* Liste */
.group { margin-top: 18px; }
.ghead { display: flex; align-items: flex-start; gap: 10px; padding: 4px 0 8px; border-bottom: 2px solid var(--line); }
.snum { flex: none; min-width: 46px; height: 46px; padding: 0 8px; border-radius: 12px; border: none; background: var(--c); color: #0d1012; font-weight: 800; font-size: 1.3rem; }
.ghead .cs-edit { font-weight: 700; font-size: 1.12rem; }
.chev { flex: none; width: 36px; height: 36px; border: none; background: none; color: var(--muted); font-size: .9rem; }
.gmeta { color: var(--muted); font-size: .82rem; padding: 2px 0 0; }
.dayname { font-weight: 700; font-size: 1.1rem; }
.rows { display: grid; gap: 8px; padding-top: 10px; }
.row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; background: var(--panel); border-radius: 12px; padding: 10px; border-left: 5px solid var(--c); }
.row.has-handle { grid-template-columns: auto auto 1fr auto; }
.row.armed { outline: 2px solid var(--accent); }
.row.impro { box-shadow: inset 0 -3px 0 var(--orange); }
.row.done { opacity: .7; }
.pnum { border: none; background: var(--panel-2); border-radius: 9px; padding: 6px 8px; min-width: 50px; display: grid; justify-items: center; gap: 3px; font-weight: 800; }
.pnum .s { font-size: .72rem; color: var(--c); font-weight: 700; }
.dots { display: flex; gap: 3px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--av); }
.pbody { min-width: 0; display: grid; gap: 6px; }
.mark { font-size: .78rem; font-weight: 700; color: var(--accent); }
.mark.next { color: #7ed321; }
.foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: .85rem; }
.temps { width: 92px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font-size: .85rem; }
.vid { display: inline-flex; gap: 8px; align-items: center; border: none; background: var(--panel-2); border-radius: 8px; padding: 4px 10px 4px 4px; font-size: .85rem; max-width: 100%; }
.vid i { width: 40px; height: 24px; border-radius: 4px; background: linear-gradient(135deg, #0f2027, #2c5364); color: #fff; display: grid; place-items: center; font-style: normal; font-size: .7rem; flex: none; }
.vid span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arm { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel-2); font-size: 1.2rem; }
.row.armed .arm { background: var(--accent); border-color: var(--accent); }
.handle { touch-action: none; user-select: none; color: var(--muted); font-size: 1.3rem; border: none; background: none; padding: 8px 2px; cursor: grab; }
.cs-edit { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 4px 6px; margin: -4px -6px; resize: none; overflow: hidden; line-height: 1.5; font-size: 1.06rem; }
.cs-edit:hover { border-color: var(--line); }
.cs-edit:focus { outline: none; border-color: var(--accent); background: var(--panel-2); }
.empty { color: var(--muted); font-style: italic; padding: 10px 4px; }

/* Bouton + */
.fab { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30; width: 64px; height: 64px; border-radius: 50%; border: none; background: var(--accent); color: var(--on-accent); font-size: 2.2rem; font-weight: 300; box-shadow: var(--shadow); touch-action: none; cursor: grab; }
.cs-ghost { position: fixed; z-index: 60; pointer-events: none; transform: translate(-50%, -100%); background: var(--panel); border: 2px solid var(--accent); border-radius: 20px; padding: 6px 12px; font-weight: 700; box-shadow: var(--shadow); white-space: nowrap; }
.cs-line { position: fixed; z-index: 55; pointer-events: none; height: 4px; background: var(--accent); border-radius: 2px; }
.cs-line span { position: absolute; left: 10px; top: -14px; background: var(--accent); color: var(--on-accent); font-size: .8rem; font-weight: 700; padding: 3px 10px; border-radius: 12px; white-space: nowrap; }
.cs-into { outline: 3px dashed var(--accent); outline-offset: 3px; border-radius: 10px; }
.cs-flash { animation: fl 1.5s ease-out; }
@keyframes fl { 0%, 35% { box-shadow: 0 0 0 3px var(--accent); } }
@media (prefers-reduced-motion: reduce) { .cs-flash { animation: none; } }

/* Fenêtres */
.cs-toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--text); color: var(--bg); border-radius: 10px; padding: 12px 14px; display: flex; gap: 14px; align-items: center; max-width: min(92vw, 480px); box-shadow: var(--shadow); }
.cs-toast button { border: none; background: none; color: var(--blue); font-weight: 800; text-transform: uppercase; }
.cs-modal-back { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; }
.cs-modal { background: var(--panel); width: min(560px, 100%); border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-height: 88vh; overflow-y: auto; }
.cs-modal h3 { margin: 0; font-size: 1.15rem; }
.cs-modal p { margin: 0; color: var(--muted); line-height: 1.45; }
.cs-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.cs-btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 11px 16px; font-weight: 700; }
.cs-btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.cs-btn.danger { background: var(--red); color: #fff; border-color: var(--red); }
.cs-btn.impro { background: var(--orange); color: #000; border-color: var(--orange); }
.cs-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); font-size: 1.1rem; }
.cs-error { color: var(--red) !important; font-weight: 600; }
.cs-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cs-chip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 16px; padding: 7px 12px; font-weight: 700; }
.cs-chip.on { background: var(--orange); border-color: var(--orange); color: #000; }
.cs-video { aspect-ratio: 16 / 9; max-width: 100%; background: #000; color: #fff; border-radius: 10px; display: grid; place-items: center; font-size: 2.4rem; }
.menu { display: grid; gap: 4px; }
.menu > button, .menu > .mi { display: flex; gap: 12px; align-items: center; text-align: left; border: none; background: var(--panel-2); border-radius: 10px; padding: 13px 14px; font-weight: 600; }
.menu .mi input { width: 90px; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.menu .danger { color: var(--red); }
.menu small { color: var(--muted); font-weight: 400; }
.takes { display: grid; gap: 4px; }
.take { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--panel-2); border-left: 4px solid var(--av); }
.take div { flex: 1; min-width: 0; }
.take small { display: block; color: var(--muted); }
.take button { border: none; background: none; color: var(--red); font-size: 1rem; }
.back { display: inline-block; margin: 30px 0 0; font-size: .8rem; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px 10px; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stick" id="stick">
    <div class="top">
      <div class="brand">🎬 <span id="proj">Projet</span></div>
      <button class="ic" id="bSearch" type="button" title="Rechercher un plan" aria-label="Rechercher">🔍</button>
      <button class="ic" id="bMore" type="button" title="Exporter en PDF" aria-label="Plus">⋯</button>
    </div>
    <div class="seg" role="tablist" aria-label="Ordre de la liste">
      <button type="button" data-sort="scenario">📖 Scénario</button>
      <button type="button" data-sort="tournage">🎥 Tournage</button>
    </div>
    <div class="search" id="search" hidden>
      <input type="search" id="q" placeholder="Mot, personnage, décor… ou 5 / 5.3" autocomplete="off" aria-label="Rechercher">
      <small id="qn"></small>
    </div>
    <div id="slate"></div>
  </div>
  <main id="list"></main>
  <a class="back" href="index.html" id="back" hidden>← Retour aux propositions</a>
</div>
<button class="fab" id="fab" type="button" aria-label="Ajouter" title="Ajouter (appuyer) · placer (maintenir et glisser)">+</button>

<script src="core.js"></script>
<script>
const { el } = CS;
const $ = (id) => document.getElementById(id);
let sort = "scenario";           // ordre de la liste
let searchOn = false, query = "";
const closedSeqs = new Set(), closedDays = new WeakSet();

function render() {
  $("proj").textContent = CS.projectName();
  document.querySelectorAll("[data-sort]").forEach((b) => b.classList.toggle("on", b.dataset.sort === sort));
  $("bSearch").classList.toggle("on", searchOn);
  $("search").hidden = !searchOn;
  $("fab").hidden = CS.readOnly;
  renderSlate();
  $("list").replaceChildren(sort === "scenario" ? renderScenario() : renderTournage());
}

// --- Barre de clap : apparaît quand un plan est armé ---
function renderSlate() {
  const p = CS.activePlan();
  if (!p) { $("slate").replaceChildren(); return; }
  const n = CS.nextTake(p.seqId, p.id);
  const com = el("input", { id: "com", type: "text", placeholder: "Commentaire / raccord", autocomplete: "off", "aria-label": "Commentaire" });
  $("slate").replaceChildren(el("div", { class: "slate" + (p.impro ? " impro" : "") },
    el("div", { class: "sl-top" },
      el("span", { class: "sl-code", text: "SÉQ " + p.seqId + " · PLAN " + p.id }),
      el("span", { class: "sl-take", text: "PRISE " + n }),
      el("span", { class: "sl-text", text: p.info }),
      el("button", { class: "sl-x", type: "button", "aria-label": "Fermer la barre de clap", text: "✕", onclick: () => { CS.active = null; render(); } })),
    el("div", { class: "sl-row" },
      el("button", { class: "clap", type: "button", text: "🎬 Clap", onclick: CS.clap }), com),
    el("div", { class: "avis6" }, CS.AVIS_BUTTONS.map((a) => el("button", { class: "av k-" + a.k, type: "button", disabled: CS.readOnly, title: a.label + " : enregistrer la prise",
      onclick: () => CS.saveTake(a.label, com.value) }, el("span", { text: a.e }), el("b", { text: a.s }))))));
}

function arm(p) {
  CS.active = CS.isActive(p) ? null : { seqId: p.seqId, planId: p.id };
  render();
}

// --- Ligne d'un plan (même composant dans les deux ordres) ---
function row(p, opts) {
  const takes = CS.takesOf(p.seqId, p.id);
  const armed = CS.isActive(p);
  return el("div", { class: "row" + (opts.handle ? " has-handle" : "") + (armed ? " armed" : "") + (p.impro ? " impro" : "") + (opts.done && takes.length && !armed ? " done" : ""),
      style: "--c:" + CS.seqColor(p.seqId), "data-seq": p.seqId, "data-plan": p.id, "data-index": opts.index },
    opts.handle && !CS.readOnly ? el("button", { class: "handle", type: "button", "aria-label": "Déplacer le plan " + CS.key(p), text: "⠿",
      onpointerdown: (e) => CS.beginDrag(e, moveOpt(opts.index, "SÉQ " + p.seqId + " · " + p.id)) }) : null,
    el("button", { class: "pnum", type: "button", title: "Numéro, vidéo, prises…", onclick: () => planMenu(p) },
      opts.showSeq ? el("span", { class: "s", text: "SÉQ " + p.seqId }) : null,
      el("span", { text: opts.showSeq ? String(p.id) : CS.key(p) }),
      takes.length ? el("span", { class: "dots" }, takes.map((t) => el("i", { class: "k-" + CS.avisKey(t.avis), style: "--av:var(--av-" + CS.avisKey(t.avis) + ")" }))) : null),
    el("div", { class: "pbody" },
      opts.mark ? el("div", { class: "mark" + (opts.mark.next ? " next" : ""), text: opts.mark.text }) : null,
      CS.textField(p, "info", "Décrire le plan…"),
      p.video || opts.temps || p.impro ? el("div", { class: "foot" },
        p.impro ? el("span", { text: "⚡ impro" }) : null,
        opts.temps ? el("input", { class: "temps cs-edit-time", type: "text", value: p.temps || "", placeholder: "⏱ temps", "aria-label": "Temps du plan " + CS.key(p), readonly: CS.readOnly,
          oninput: (e) => { p.temps = e.target.value; CS.saveSoon(); }, onchange: () => { CS.saveNow(); render(); } }) : null,
        p.video ? el("button", { class: "vid", type: "button", onclick: () => CS.previewVideo(p) }, el("i", { text: "▶" }), el("span", { text: p.video.name })) : null) : null),
    el("button", { class: "arm", type: "button", title: armed ? "Arrêter" : "Tourner ce plan", "aria-label": (armed ? "Désarmer" : "Tourner") + " le plan " + CS.key(p), text: "🎬", onclick: () => arm(p) }));
}

// --- Ordre du scénario ---
function renderScenario() {
  const q = CS.parseQuery(query);
  const frag = el("div");
  let shown = 0, total = 0;
  CS.seqs().forEach((s) => {
    const plans = CS.plansOf(s.id);
    total += plans.length;
    const vis = plans.filter((p) => CS.matches(p, q));
    shown += vis.length;
    if (q && !vis.length) return;
    const open = q || !closedSeqs.has(s.id);
    frag.append(el("section", { class: "group", "data-seq": s.id, style: "--c:" + CS.seqColor(s.id) },
      el("div", { class: "ghead" },
        el("button", { class: "snum", type: "button", title: "Numéro de la séquence", onclick: () => seqMenu(s), text: String(s.id) }),
        el("div", { style: "flex:1;min-width:0" }, CS.textField(s, "info", "Lieu, moment, personnages…"),
          el("div", { class: "gmeta", text: plans.length + " plan" + (plans.length > 1 ? "s" : "") })),
        el("button", { class: "chev", type: "button", "aria-label": open ? "Replier" : "Déplier", text: open ? "▼" : "▶", onclick: () => { open ? closedSeqs.add(s.id) : closedSeqs.delete(s.id); render(); } })),
      open ? el("div", { class: "rows" }, vis.length ? vis.map((p) => row(p, {})) : el("div", { class: "empty", text: "Pas encore de plan : glissez le bouton + ici." })) : null));
  });
  if (!CS.seqs().length) frag.append(el("div", { class: "empty", text: "Pas encore de séquence : appuyez sur +." }));
  $("qn").textContent = q ? shown + " / " + total : total + " plans";
  return frag;
}

// --- Ordre de tournage : journées ---
function renderTournage() {
  const q = CS.parseQuery(query);
  const last = CS.lastTake(), next = CS.nextToShoot();
  const frag = el("div");
  let shown = 0, total = 0;
  CS.days().forEach((g) => {
    const vis = g.items.filter(({ p }) => CS.matches(p, q));
    total += g.items.length; shown += vis.length;
    if (q && !vis.length) return;
    const open = q || !g.sep || !closedDays.has(g.sep);
    const shot = g.items.filter(({ p }) => CS.takesOf(p.seqId, p.id).length).length;
    const mins = CS.dayMinutes(g);
    const meta = [g.items.length + " plans", mins ? "≈ " + CS.fmtMin(mins) : "", shot + "/" + g.items.length + " tournés"].filter(Boolean).join(" · ");
    frag.append(el("section", { class: "group", "data-day": g.index },
      el("div", { class: "ghead" },
        g.sep && !CS.readOnly ? el("button", { class: "handle", type: "button", "aria-label": "Déplacer la journée", text: "⠿", onpointerdown: (e) => CS.beginDrag(e, moveDayOpt(g.index, g.sep.text || "Journée")) }) : null,
        el("div", { style: "flex:1;min-width:0" },
          g.sep ? el("input", { class: "cs-edit dayname", type: "text", value: g.sep.text || "", placeholder: "Nom de la journée (Lundi matin…)", readonly: CS.readOnly, "aria-label": "Nom de la journée",
              oninput: (e) => { g.sep.text = e.target.value; CS.saveSoon(); }, onchange: CS.saveNow })
            : el("div", { class: "dayname", text: "Pas encore dans une journée" }),
          el("div", { class: "gmeta", text: meta })),
        g.sep ? el("button", { class: "chev", type: "button", text: open ? "▼" : "▶", "aria-label": open ? "Replier" : "Déplier", onclick: () => { open ? closedDays.add(g.sep) : closedDays.delete(g.sep); render(); } }) : null,
        g.sep && !CS.readOnly ? el("button", { class: "chev", type: "button", title: "Supprimer la journée (ses plans rejoignent la précédente)", text: "✕", onclick: () => CS.deleteDay(g.index) }) : null),
      open ? el("div", { class: "rows" }, vis.map(({ index, p }) => row(p, {
        index, handle: true, showSeq: true, temps: true, done: true,
        mark: last && last.seqId === p.seqId && last.planId === p.id ? { text: "📍 Dernière prise · n° " + last.prise } : next === p ? { text: "▶ À suivre", next: true } : null
      }))) : null));
  });
  $("qn").textContent = q ? shown + " / " + total : total + " plans";
  return frag;
}

// --- Menus (appui sur un numéro) ---
function planMenu(p) {
  CS.modal("Plan " + CS.key(p), (close) => {
    const num = el("input", { type: "number", inputmode: "numeric", min: "1", value: String(p.id), "aria-label": "Numéro du plan" });
    const err = el("small", { class: "cs-error" });
    const setNum = async () => { const r = await CS.setPlanNum(p.seqId, p.id, num.value); if (r) err.textContent = r; else close(); };
    num.addEventListener("keydown", (e) => { if (e.key === "Enter") setNum(); });
    const takes = CS.takesOf(p.seqId, p.id);
    return [
      el("p", { text: p.info || "Plan sans description" }),
      el("div", { class: "menu" },
        CS.readOnly ? null : el("div", { class: "mi" }, "N°", num, el("button", { class: "cs-btn", type: "button", text: "OK", onclick: setNum }), err),
        p.video ? el("button", { type: "button", onclick: () => { close(); CS.previewVideo(p); } }, "▶", el("span", {}, "Vidéo de référence ", el("small", { text: p.video.name })))
          : CS.readOnly ? null : el("button", { type: "button", onclick: () => { close(); CS.pickVideo(p); } }, "🎞️", "Ajouter une vidéo de référence (Drive)"),
        el("button", { type: "button", onclick: () => { close(); arm(p); } }, "🎬", CS.isActive(p) ? "Arrêter de tourner ce plan" : "Tourner ce plan"),
        CS.readOnly ? null : el("button", { class: "danger", type: "button", onclick: () => { close(); CS.deletePlan(p.seqId, p.id); } }, "🗑", "Supprimer le plan ", el("small", { text: "(les suivants remontent)" }))),
      takes.length ? el("div", { class: "takes" }, el("small", { text: "Prises" }), takes.map((t) => el("div", { class: "take", style: "--av:var(--av-" + CS.avisKey(t.avis) + ")" },
        el("div", {}, el("b", { text: "Prise " + t.prise + " · " + t.avis }), t.com ? el("small", { text: t.com }) : null),
        CS.readOnly ? null : el("button", { type: "button", title: "Supprimer la prise", text: "✕", onclick: () => { CS.deleteTake(t.uid); close(); planMenu(p); } })))) : null
    ];
  });
}
function seqMenu(s) {
  CS.modal("Séquence " + s.id, (close) => {
    const num = el("input", { type: "number", inputmode: "numeric", min: "1", value: String(s.id), "aria-label": "Numéro de la séquence" });
    const err = el("small", { class: "cs-error" });
    const setNum = async () => { const r = await CS.setSeqNum(s.id, num.value); if (r) err.textContent = r; else { close(); CS.afterRender({ scroll: `.group[data-seq="${s.id}"]`, flash: `.group[data-seq="${s.id}"] .snum` }); CS.render(); } };
    num.addEventListener("keydown", (e) => { if (e.key === "Enter") setNum(); });
    return [el("div", { class: "menu" },
      CS.readOnly ? null : el("div", { class: "mi" }, "N°", num, el("button", { class: "cs-btn", type: "button", text: "OK", onclick: setNum }), err),
      el("p", { text: "Les numéros peuvent sauter (1, 2, 5…) : la liste reste dans l'ordre." }),
      CS.readOnly ? null : el("button", { class: "danger", type: "button", onclick: () => { close(); CS.deleteSeq(s.id); } }, "🗑", "Supprimer la séquence et ses plans"))];
  });
}

// --- Bouton + : appui = menu, maintenir et glisser = placer ---
function addMenu() {
  CS.modal("Ajouter", (close) => {
    const seqs = CS.seqs(), lastSeq = seqs[seqs.length - 1];
    const items = sort === "scenario" ? [
      el("button", { type: "button", onclick: async () => { close(); const id = await CS.insertSeq(lastSeq ? lastSeq.id : 0); focusSeq(id); } }, "📁", "Séquence (à la fin)"),
      lastSeq ? el("button", { type: "button", onclick: async () => { close(); const p = await CS.insertPlan(lastSeq.id, CS.plansOf(lastSeq.id).length); focusPlan(p); } }, "🎬", "Plan (fin de la séquence " + lastSeq.id + ")") : null
    ] : [
      el("button", { type: "button", onclick: () => { close(); const at = CS.insertDay(CS.state.tournageList.length); focusDay(at); } }, "📅", "Journée (à la fin)")
    ];
    return [el("div", { class: "menu" }, items,
      seqs.length ? el("button", { type: "button", onclick: () => { close(); CS.improDialog(CS.active ? CS.active.seqId : null, null, (p) => { sort = "tournage"; focusRow(p); }); } }, "⚡", "Plan improvisé ", el("small", { text: "(après le plan en cours)" })) : null),
      el("p", { text: "Astuce : maintenez + et glissez-le dans la liste pour choisir l'endroit exact." })];
  });
}
const focusSeq = (id) => { if (id) { CS.afterRender({ scroll: `.group[data-seq="${id}"]`, focus: `.group[data-seq="${id}"] .ghead textarea` }); CS.render(); } };
const focusPlan = (p) => { if (p) { CS.afterRender({ scroll: `.row[data-seq="${p.seqId}"][data-plan="${p.id}"]`, focus: `.row[data-seq="${p.seqId}"][data-plan="${p.id}"] textarea` }); CS.render(); } };
const focusDay = (at) => { CS.afterRender({ scroll: `.group[data-day="${at}"]`, focus: `.group[data-day="${at}"] input` }); CS.render(); };
const focusRow = (p) => { CS.afterRender({ scroll: `.row[data-seq="${p.seqId}"][data-plan="${p.id}"]`, flash: `.row[data-seq="${p.seqId}"][data-plan="${p.id}"]` }); CS.render(); };
const stickH = () => $("stick").offsetHeight;

function fabOpt() {
  return {
    label: "+", topInset: stickH, onTap: addMenu,
    resolve: (x, y, under) => {
      if (sort === "scenario") {
        const r = under.closest(".row");
        if (r) {
          const seqId = +r.dataset.seq, id = +r.dataset.plan, h = CS.half(r, y);
          const pos = CS.plansOf(seqId).findIndex((p) => p.id === id) + (h.before ? 0 : 1);
          return { ...h, text: "Plan " + seqId + "." + (pos + 1) + (pos < CS.plansOf(seqId).length ? " · les suivants +1" : ""), run: async () => focusPlan(await CS.insertPlan(seqId, pos)) };
        }
        const g = under.closest(".group");
        if (g) {
          const seqId = +g.dataset.seq, head = g.querySelector(".ghead");
          if (under.closest(".ghead")) {
            const h = CS.half(head, y);
            if (h.before) {
              // Moitié haute de l'en-tête : nouvelle séquence juste avant
              const seqs = CS.seqs(), i = seqs.findIndex((s) => s.id === seqId), afterId = i > 0 ? seqs[i - 1].id : 0;
              return { rect: g.getBoundingClientRect(), before: true, text: "Séquence " + (afterId + 1) + " ici", run: async () => focusSeq(await CS.insertSeq(afterId)) };
            }
            // Moitié basse : premier plan de cette séquence (une séquence fermée s'ouvre si on attend)
            return { rect: head.getBoundingClientRect(), before: false, into: head, text: "Plan " + seqId + ".1 (en tête)", hoverKey: "s" + seqId, hoverOpen: () => closedSeqs.delete(seqId),
              run: async () => focusPlan(await CS.insertPlan(seqId, 0)) };
          }
          // Ailleurs dans la séquence (zone vide) : plan à la fin
          const n = CS.plansOf(seqId).length;
          return { rect: g.getBoundingClientRect(), before: false, text: "Plan " + seqId + "." + (n + 1) + " (fin)", run: async () => focusPlan(await CS.insertPlan(seqId, n)) };
        }
        const groups = [...document.querySelectorAll(".group")], lastG = groups[groups.length - 1];
        if (!lastG || y > lastG.getBoundingClientRect().bottom) {
          const seqs = CS.seqs(), afterId = seqs.length ? seqs[seqs.length - 1].id : 0;
          return { rect: lastG ? lastG.getBoundingClientRect() : $("list").getBoundingClientRect(), before: !lastG, text: "Séquence " + (afterId + 1) + " (fin)", run: async () => focusSeq(await CS.insertSeq(afterId)) };
        }
        return null;
      }
      // Ordre de tournage : + crée une journée
      const r = under.closest(".row");
      if (r) { const h = CS.half(r, y), at = +r.dataset.index + (h.before ? 0 : 1); return { ...h, text: "Nouvelle journée ici", run: () => focusDay(CS.insertDay(at)) }; }
      const g = under.closest(".group");
      if (g && g.dataset.day !== "-1") { const at = +g.dataset.day; return { rect: g.getBoundingClientRect(), before: true, text: "Nouvelle journée ici", run: () => focusDay(CS.insertDay(at)) }; }
      return null;
    }
  };
}
function moveOpt(from, label) {
  return {
    label, armed: true, topInset: stickH,
    onStart: () => { const n = document.querySelector(`.row[data-index="${from}"]`); if (n) n.style.opacity = ".35"; },
    resolve: (x, y, under) => {
      const r = under.closest(".row");
      if (r) {
        const h = CS.half(r, y), at = +r.dataset.index + (h.before ? 0 : 1);
        if (at === from || at === from + 1) return null;
        return { ...h, text: "Déplacer ici", run: () => { const to = CS.moveItem(from, at); CS.afterRender({ flash: `.row[data-index="${to}"]` }); CS.render(); } };
      }
      const g = under.closest(".group");
      if (g && g.dataset.day !== "-1") {
        const sep = +g.dataset.day, head = g.querySelector(".ghead"), at = sep + 1;
        if (at === from || at === from + 1) return null;
        const day = CS.state.tournageList[sep];
        return { rect: head.getBoundingClientRect(), before: false, into: head, text: "En tête de « " + (day.text || "journée") + " »", hoverKey: "d" + sep, hoverOpen: () => closedDays.delete(day),
          run: () => { CS.moveItem(from, at); } };
      }
      return null;
    }
  };
}
function moveDayOpt(from, label) {
  return {
    label: "📅 " + label, armed: true, topInset: stickH,
    resolve: (x, y, under) => {
      const g = under.closest(".group");
      if (!g || g.dataset.day === "-1") return null;
      const sep = +g.dataset.day, h = CS.half(g, y, 50), at = h.before ? sep : CS.dayEnd(sep);
      if (at >= from && at <= CS.dayEnd(from)) return null;
      return { ...h, text: "Déplacer la journée ici", run: () => CS.moveDay(from, at) };
    }
  };
}

// --- Événements ---
$("fab").addEventListener("pointerdown", (e) => CS.beginDrag(e, fabOpt()));
document.querySelectorAll("[data-sort]").forEach((b) => b.addEventListener("click", () => {
  sort = b.dataset.sort;
  if (sort === "tournage") {
    const last = CS.lastTake();
    if (!CS.active && last) CS.active = { seqId: last.seqId, planId: last.planId };
    const a = CS.activePlan();
    if (a) { const d = CS.dayOf(a); if (d && d.sep) closedDays.delete(d.sep); CS.afterRender({ scroll: `.row[data-seq="${a.seqId}"][data-plan="${a.id}"]` }); }
  } else window.scrollTo(0, 0);
  CS.render();
}));
$("bSearch").addEventListener("click", () => { searchOn = !searchOn; if (!searchOn) { query = ""; $("q").value = ""; } render(); if (searchOn) $("q").focus(); });
$("q").addEventListener("input", (e) => { query = e.target.value; render(); });
$("bMore").addEventListener("click", () => CS.modal("Exporter", (close) => [el("div", { class: "menu" },
  el("button", { type: "button", onclick: () => { close(); CS.exportPDF("decoupage"); } }, "📄", "PDF du découpage (ordre du scénario)"),
  el("button", { type: "button", onclick: () => { close(); CS.exportPDF("travail"); } }, "📄", "PDF du plan de travail (ordre de tournage)"))]));
if (!window.OneAppAPI.__oneapp) $("back").hidden = false;
CS.keyboard(stickH);
CS.boot(render);
</script>
</body>
