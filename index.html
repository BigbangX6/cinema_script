<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Script</title>
    
    <!-- Déclaration de la Web App -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    
    <!-- Support spécifique pour iOS / Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cinema Script">
    <link rel="apple-touch-icon" href="./icon.png">

    <style>
        /* --- VARIABLES MODE SOMBRE (DEFAUT) --- */
        :root {
            --bg-body: #121212;
            --text-main: #ffffff;
            --bg-panel: #1a1a1a;
            --bg-input: #2a2a2a;
            --border-color: #333;
            --border-input: #555;
            --take-list-bg: #1e1e1e;
            --take-item-border: #333;
            --text-muted: #888;
            --btn-muted-bg: #444;
        }

        /* --- VARIABLES MODE CLAIR (AUTO) --- */
        @media (prefers-color-scheme: light) {
            :root {
                --bg-body: #f0f2f5;
                --text-main: #121212;
                --bg-panel: #ffffff;
                --bg-input: #f9f9f9;
                --border-color: #ddd;
                --border-input: #ccc;
                --take-list-bg: #f8f9fa;
                --take-item-border: #eee;
                --text-muted: #666;
                --btn-muted-bg: #ccc;
            }
        }

        /* --- STYLE GENERAL --- */
        body { font-family: system-ui, sans-serif; background-color: var(--bg-body); color: var(--text-main); padding: 0; margin: 0; transition: background-color 0.3s, color 0.3s; }
        
        .app-container { display: flex; flex-direction: column; padding: 15px; gap: 20px; }
        .left-panel { display: flex; flex-direction: column; gap: 15px; }
        .right-panel { display: flex; flex-direction: column; padding-bottom: 100px; }

        @media (min-width: 900px) {
            .app-container { flex-direction: row; align-items: flex-start; max-width: 1600px; margin: 0 auto; height: 100vh; overflow: hidden; }
            .left-panel { width: 32%; position: sticky; top: 15px; height: calc(100vh - 30px); overflow-y: auto; padding-right: 10px; }
            .right-panel { width: 68%; height: calc(100vh - 30px); overflow-y: auto; padding-right: 10px; }
            ::-webkit-scrollbar { width: 8px; }
            ::-webkit-scrollbar-track { background: var(--bg-panel); border-radius: 4px; }
            ::-webkit-scrollbar-thumb { background: var(--border-input); border-radius: 4px; }
            ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
        }

        /* -- BANDEAU D'INSTALLATION & PARTAGE -- */
        .app-banner { display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .app-banner-info { display: flex; align-items: center; gap: 10px; }
        .app-banner-icon { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; }
        .app-banner-title { font-weight: bold; font-size: 1rem; color: var(--text-main); }
        .app-banner-actions { display: flex; gap: 8px; }
        .btn-banner { background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border-input); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: 0.2s; }
        .btn-banner:hover { background: var(--border-color); }
        
        /* -- PROJECT NAME -- */
        .project-title-btn { background: var(--bg-panel); border: 1px dashed #50e3c2; color: #50e3c2; width: 100%; padding: 15px; font-size: 1.2rem; font-weight: bold; border-radius: 12px; cursor: pointer; text-align: left; transition: 0.2s; }
        .project-title-btn:hover { opacity: 0.8; }

        /* -- TABLEAU DE BORD -- */
        .dashboard { background: var(--bg-panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .status-board { font-size: 1.5rem; text-align: center; margin-bottom: 15px; background: var(--bg-input); padding: 15px; border-radius: 10px; font-weight: bold; border: 2px solid #50e3c2; color: #50e3c2; }
        .status-board.inactive { border-color: var(--border-color); color: var(--text-muted); }
        .controls { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .btn-save { background: #7ed321; color: black; font-size: 1.3rem; padding: 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.1s; }
        .btn-save:active { transform: scale(0.98); }
        .btn-clap { background: #4a90e2; color: white; font-size: 1.1rem; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.1s; }
        .btn-clap:active { transform: scale(0.98); }
        input, select { padding: 15px; font-size: 1.1rem; background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border-input); border-radius: 8px; width: 100%; box-sizing: border-box; }
        
        /* -- ZONE ACCORDÉON (DÉCOUPAGE) -- */
        .acc-header { display: flex; flex-direction: column; padding: 12px 15px; border-radius: 8px; margin-top: 15px; border-left: 5px solid; transition: border-color 0.2s; color: white; }
        .acc-seq { background: #34495e; border-left-color: #4a90e2; }
        .acc-plan { background: #2c3e50; border-left-color: #50e3c2; margin-left: 15px; }
        .acc-plan.impro { border-left-color: #f5a623; }
        .acc-plan.active { border: 2px solid #50e3c2; background: #1f2d3d; }
        
        .acc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .acc-title { display: flex; align-items: center; cursor: pointer; flex-grow: 1; user-select: none; }
        .header-label { font-weight: bold; font-size: 1.2rem; margin-right: 10px; display: flex; align-items: center; gap: 8px; }
        .edit-seq-btn { font-size: 1rem; cursor: pointer; padding: 2px; border-radius: 4px; transition: 0.2s; opacity: 0.7; }
        .edit-seq-btn:hover { opacity: 1; background: rgba(255,255,255,0.2); }
        .chevron { font-size: 0.9rem; opacity: 0.7; }
        
        .header-input { background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px; font-size: 1rem; border-radius: 5px; width: 100%; box-sizing: border-box; resize: none; overflow: hidden; line-height: 1.4; font-family: inherit; }
        .header-input:focus { outline: 1px solid #50e3c2; background: rgba(0,0,0,0.4); }
        
        .inline-actions { display: flex; gap: 5px; align-items: center; }
        .btn-icon { background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 5px; opacity: 0.6; transition: 0.2s; border-radius: 5px; }
        .btn-icon:hover { opacity: 1; background: rgba(255,255,255,0.1); }

        .acc-content { display: none; margin-bottom: 15px; }
        .acc-content.open { display: block; }
        
        /* -- LISTE DES PRISES -- */
        .take-list { margin-left: 30px; margin-top: 5px; background: var(--take-list-bg); border-radius: 8px; padding: 10px; border-left: 2px solid var(--border-input); }
        .take-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid var(--take-item-border); align-items: center; }
        .take-item:last-child { border-bottom: none; }
        .btn-delete { background: #d0021b; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
        
        /* -- MODE TOURNAGE -- */
        .mode-toggle { display: flex; margin-bottom: 20px; background: var(--border-color); border-radius: 8px; overflow: hidden; }
        .mode-btn { flex: 1; padding: 12px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 1.1rem; }
        .mode-btn.active { background: #4a90e2; color: white; }
        
        .tournage-list { display: flex; flex-direction: column; gap: 8px; }
        .tournage-item { display: flex; align-items: center; gap: 10px; background: #2c3e50; color: white; padding: 10px 15px; border-radius: 8px; }
        .tournage-sep { background: #5a3c20; border-left: 4px solid #f5a623; }
        .take-badge { background: #7ed321; color: black; font-size: 0.8rem; font-weight: bold; padding: 3px 8px; border-radius: 12px; margin-left: auto; }
        
        /* -- DRAG & DROP (POIGNEE) -- */
        .drag-handle { cursor: grab; font-size: 1.8rem; padding-right: 15px; color: var(--text-muted); touch-action: none; user-select: none; }
        .drag-handle:active { cursor: grabbing; color: #50e3c2; }
        .tournage-item.dragging { opacity: 0.5; }
        .tournage-item.drag-over { border-top: 3px solid #50e3c2; }
        .placeholder { border: 2px dashed var(--border-input); background: transparent; border-radius: 8px; box-sizing: border-box; margin: 0; }

        .add-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-left: 15px; margin-top: 10px; }
        .btn-add { background: var(--bg-input); color: var(--text-main); border: 1px dashed var(--text-muted); padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-add:hover { background: var(--border-color); }
        
        /* -- ACTIONS FICHIER -- */
        .action-row { display: flex; flex-direction: column; gap: 12px; background: var(--bg-panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .btn-action { padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-reset { background: var(--btn-muted-bg); color: var(--text-main); }
        .btn-import { background: #bd10e0; color: white; }
        .btn-export { background: #ffffff; color: black; }
        .btn-pdf { background: #f5a623; color: black; }
        .btn-pdf-decoupage { background: #50e3c2; color: black; }

        /* --- MODE IMPRESSION (PDF / PAPIER) --- */
        #printArea { display: none; }
        
        @media print {
            body { background: white !important; color: black !important; margin: 0; padding: 0; }
            .app-container { display: none !important; }
            #printArea { display: block !important; padding: 20px; }
            
            .print-title { color: #d0021b; text-align: center; font-size: 28px; margin-bottom: 5px; text-transform: uppercase; }
            .print-subtitle { text-align: center; color: #555; margin-bottom: 30px; font-size: 14px; }
            
            table { width: 100%; border-collapse: collapse; page-break-inside: auto; font-size: 12px; }
            tr { page-break-inside: avoid; page-break-after: auto; }
            th { background-color: #222 !important; color: white !important; padding: 10px; text-align: left; -webkit-print-color-adjust: exact; color-adjust: exact; }
            td { border: 1px solid #ccc; padding: 10px; vertical-align: top; }
            
            .print-seq-row { background-color: #e3f2fd !important; -webkit-print-color-adjust: exact; color-adjust: exact; }
            .print-seq-num { font-size: 16px; font-weight: bold; color: #4a90e2; }
            .print-seq-info { font-size: 14px; font-weight: bold; color: #333; }
            
            .print-sep-row { background-color: #fff3e0 !important; -webkit-print-color-adjust: exact; color-adjust: exact; text-align: center; font-weight: bold; color: #e65100; font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- INTERFACE PRINCIPALE -->
    <div class="app-container">
        <div class="left-panel">
            
            <!-- BANDEAU D'INSTALLATION -->
            <div class="app-banner">
                <div class="app-banner-info">
                    <img src="./icon.png" alt="Icon" class="app-banner-icon" onerror="this.style.display='none'">
                    <span class="app-banner-title">Cinema Script</span>
                </div>
                <div class="app-banner-actions">
                    <button class="btn-banner" onclick="shareApp()">🔗 Partager</button>
                    <button class="btn-banner" onclick="installApp()">⬇️ Installer</button>
                </div>
            </div>

            <button class="project-title-btn" onclick="editProjectName()">
                🎬 PROJET : <span id="projNameDisp" style="color: var(--text-main);">Nouveau Projet</span> ✏️
            </button>

            <div class="dashboard">
                <div id="statusBoard" class="status-board inactive">
                    SÉLECTIONNEZ UN PLAN<br>POUR TOURNER
                </div>
                
                <div id="takeControls" class="controls" style="display: none;">
                    <select id="avis">
                        <option value="❓ À vérifier">❓ À vérifier</option>
                        <option value="✅ OK (Bonne)">✅ OK (Bonne)</option>
                        <option value="⭐ MASTER (Parfaite)">⭐ MASTER (Parfaite)</option>
                        <option value="😐 Moyen">😐 Moyen</option>
                        <option value="😕 Bof">😕 Bof</option>
                        <option value="❌ KO (Ratée)">❌ KO (Ratée)</option>
                    </select>
                    <input type="text" id="com" placeholder="Commentaire / Raccord (ex: point flou)">
                    <button class="btn-save" onclick="saveTake()">ENREGISTRER LA PRISE</button>
                    <button class="btn-clap" onclick="playClapAudio()">🎬 Clap audio</button>
                </div>
            </div>

            <div class="action-row">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <button class="btn-action btn-pdf" onclick="exportPDF('tournage')">📄 PDF (Tournage)</button>
                    <button class="btn-action btn-pdf-decoupage" onclick="exportPDF('decoupage')">📄 PDF (Découpage)</button>
                </div>
                <button class="btn-action btn-export" onclick="exportCSV()">💾 Lier et Exporter CSV</button>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <button class="btn-action btn-import" onclick="document.getElementById('csvInput').click()">📂 Importer</button>
                    <button class="btn-action btn-reset" onclick="resetCache()">🗑️ RAZ</button>
                </div>
                <input type="file" id="csvInput" accept=".csv" style="display: none;" onchange="importCSV(event)">
            </div>
            
            <!-- BOUTONS DE MODE DÉPLACÉS ICI -->
            <div class="mode-toggle" style="flex-direction: column; margin-bottom: 0;">
                <button id="btnModeDecoupage" class="mode-btn active" onclick="setViewMode('decoupage')">📖 Mode Découpage (Scénario)</button>
                <button id="btnModeTournage" class="mode-btn" onclick="setViewMode('tournage')">🎥 Mode Plan de Travail (Global)</button>
            </div>
        </div>

        <div class="right-panel">
            <div id="accordionContainer">
                <!-- Généré par JavaScript -->
            </div>
            <button id="btnAddSeq" class="btn-add" style="width: 100%; border-color: #4a90e2; color: #4a90e2; margin-top: 15px;" onclick="addSequence()">+ NOUVELLE SÉQUENCE</button>
        </div>
    </div>

    <!-- ZONE INVISIBLE (POUR LE PDF) -->
    <div id="printArea"></div>

    <script>
        // --- CLASSE DU CLAP AUDIO ---
        class DigitalClapper {
            constructor() {
                this.audioCtx = null;
                this.dtmfFreqs = {
                    '1': [697, 1209], '2': [697, 1336], '3': [697, 1477],
                    '4': [770, 1209], '5': [770, 1336], '6': [770, 1477],
                    '7': [852, 1209], '8': [852, 1336], '9': [852, 1477],
                    '*': [941, 1209], '0': [941, 1336], '#': [941, 1477]
                };
            }
            play(scene, shot, take) {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
                const payload = `*${scene}*${shot}*${take}#`;
                const now = this.audioCtx.currentTime;
                
                this._playTransient(now);
                
                let timeCursor = now + 0.065;
                const toneDuration = 0.080;
                const pauseDuration = 0.040;
                for (let i = 0; i < payload.length; i++) {
                    const char = payload[i];
                    if (this.dtmfFreqs[char]) {
                        this._playDTMF(this.dtmfFreqs[char][0], this.dtmfFreqs[char][1], timeCursor, toneDuration);
                        timeCursor += toneDuration + pauseDuration;
                    }
                }
                
            }
            _playTransient(startTime) {
                const clickOsc = this.audioCtx.createOscillator();
                const clickGain = this.audioCtx.createGain();
                clickOsc.type = 'square';
                clickOsc.frequency.value = 1000;
                clickGain.gain.setValueAtTime(0, startTime);
                clickGain.gain.linearRampToValueAtTime(1, startTime + 0.001);
                clickGain.gain.setValueAtTime(1, startTime + 0.010);
                clickGain.gain.linearRampToValueAtTime(0, startTime + 0.015);
                clickOsc.connect(clickGain);
                clickGain.connect(this.audioCtx.destination);
                clickOsc.start(startTime);
                clickOsc.stop(startTime + 0.020);
            }
            _playDTMF(f1, f2, startTime, duration) {
                const osc1 = this.audioCtx.createOscillator();
                const osc2 = this.audioCtx.createOscillator();
                const gainNode = this.audioCtx.createGain();
                osc1.frequency.value = f1;
                osc2.frequency.value = f2;
                osc1.type = 'sine';
                osc2.type = 'sine';
                gainNode.gain.setValueAtTime(0, startTime);
                gainNode.gain.linearRampToValueAtTime(0.5, startTime + 0.005);
                gainNode.gain.setValueAtTime(0.5, startTime + duration - 0.005);
                gainNode.gain.linearRampToValueAtTime(0, startTime + duration);
                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(this.audioCtx.destination);
                osc1.start(startTime);
                osc2.start(startTime);
                osc1.stop(startTime + duration);
                osc2.stop(startTime + duration);
            }
        }

        // --- INSTALLATION PWA & PARTAGE ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('Installation acceptée');
                    }
                    deferredPrompt = null;
                });
            } else {
                const isIos = () => /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
                if(isIos()) {
                    alert("Pour installer sur iOS :\n\n1. Touchez l'icône 'Partager' (le carré avec une flèche vers le haut).\n2. Sélectionnez 'Sur l'écran d'accueil'.");
                } else {
                    alert("L'application est déjà installée sur votre appareil ou votre navigateur ne supporte pas cette fonction.");
                }
            }
        }

        function shareApp() {
            const shareData = {
                title: 'Cinema Script',
                text: 'Découvrez Cinema Script, mon outil de scripte et plan de travail.',
                url: 'https://bigbangx6.github.io/cinema_script/'
            };
            if (navigator.share) {
                navigator.share(shareData).catch(console.error);
            } else {
                prompt("Votre navigateur ne supporte pas le partage natif. Copiez ce lien :", shareData.url);
            }
        }

        // --- BASE DE DONNÉES LOCALE ---
        let db = { 
            projectName: "", 
            sequences: [], 
            plans: [], 
            takes: [],
            tournageList: [] 
        };

        let viewMode = 'decoupage'; // Mode global: 'decoupage' ou 'tournage'
        let openSeq = null;     
        let openPlan = null;    
        let activeSeq = null;   
        let activePlan = null;  
        let fileHandle = null;
        
        // --- INSTANCIATION DU CLAPPER ---
        const clapper = new DigitalClapper();

        // --- INITIALISATION & MIGRATION V3 ---
        if (localStorage.getItem('kinoDB_v2')) {
            db = JSON.parse(localStorage.getItem('kinoDB_v2'));
            
            // Migration: Transformer les listes de tournage par séquence en une liste globale
            if (!db.tournageList) {
                db.tournageList = [];
                db.sequences.forEach(s => {
                    if(s.tournageList) {
                        s.tournageList.forEach(item => {
                            if (item.type === 'plan') {
                                db.tournageList.push({ type: 'plan', seqId: s.id, planId: item.id });
                            } else if (item.type === 'sep') {
                                db.tournageList.push({ type: 'sep', text: item.text });
                            }
                        });
                        delete s.tournageList;
                        delete s.modeTournage;
                    }
                });
            }
        } else {
            db.sequences.push({ id: 1, info: "" });
            db.plans.push({ seqId: 1, id: 1, impro: 0, info: "", temps: "" });
            db.tournageList.push({ type: 'plan', seqId: 1, planId: 1 });
            openSeq = 1;
        }

        renderApp();

        // --- UTILITAIRES ---
        function autoResizeTextarea(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
        }

        function getFileName() {
            const name = db.projectName ? db.projectName.replace(/[^a-zA-Z0-9_-]/g, '_') : 'Kino';
            const d = new Date();
            const pad = n => n < 10 ? '0'+n : n;
            const dateStr = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}`;
            return `${name}_${dateStr}`;
        }

        async function requireProjectName() {
            if (!db.projectName || db.projectName.trim() === '') {
                let name = prompt("🎬 Nommez votre projet avant de sauvegarder (ex: Kino_Action) :");
                if (name) {
                    db.projectName = name.trim();
                    renderProjectName();
                    saveDataSilently();
                }
            }
        }

        function editProjectName() {
            let name = prompt("Modifier le nom du projet :", db.projectName);
            if (name !== null) {
                db.projectName = name.trim();
                renderProjectName();
                saveDataSilently();
            }
        }

        function renderProjectName() {
            document.getElementById('projNameDisp').innerText = db.projectName || "Nouveau Projet";
        }

        function setViewMode(mode) {
            viewMode = mode;
            renderApp();
        }
        
        // --- DECLENCHEMENT DU CLAP AUDIO ---
        function playClapAudio() {
            if (activeSeq !== null && activePlan !== null) {
                const nextTake = db.takes.filter(t => t.seqId === activeSeq && t.planId === activePlan).length + 1;
                clapper.play(activeSeq, activePlan, nextTake);
            } else {
                alert("Veuillez d'abord sélectionner un plan.");
            }
        }

        // --- MOTEUR DE RENDU UI ---
        function renderApp() {
            renderProjectName();
            const container = document.getElementById('accordionContainer');
            container.innerHTML = '';
            
            document.getElementById('btnModeDecoupage').className = `mode-btn ${viewMode === 'decoupage' ? 'active' : ''}`;
            document.getElementById('btnModeTournage').className = `mode-btn ${viewMode === 'tournage' ? 'active' : ''}`;
            document.getElementById('btnAddSeq').style.display = viewMode === 'decoupage' ? 'block' : 'none';

            if (viewMode === 'decoupage') {
                // --- MODE DÉCOUPAGE NORMAL (SÉQUENCES > PLANS) ---
                db.sequences.forEach(seq => {
                    const seqHeader = document.createElement('div');
                    seqHeader.className = 'acc-header acc-seq';

                        <div class="acc-title" onclick="toggleSeq(${seq.id})">

                                SÉQ ${seq.id} 
                                <span class="edit-seq-btn" onclick="editSeqId(${seq.id}, event)" title="Modifier le numéro de Séquence">✏️</span>
                            </span>
                            <span class="chevron">${openSeq === seq.id ? '▼' : '▶'}</span>
                        </div>
                        <div class="inline-actions">
                            <button class="btn-icon" onclick="insertSeqBefore(${seq.id})" title="Insérer avant">➕</button>
                            <button class="btn-icon" onclick="deleteSeq(${seq.id})" title="Supprimer">❌</button>

                    container.appendChild(seqHeader);

                    const seqContent = document.createElement('div');

                            <div class="acc-title" onclick="activatePlan(${seq.id}, ${plan.id})">
                                <span class="header-label">PLAN ${plan.id} ${plan.impro ? '(IMPRO)' : ''}</span>
                                <span class="chevron">${openPlan === plan.id ? '▼' : '▶'}</span>

                                <button class="btn-icon" onclick="insertPlanBefore(${seq.id}, ${plan.id})" title="Insérer avant">➕</button>

                        planInput.className = 'header-input';
                        planInput.rows = 1;
                        planInput.placeholder = "Découpage technique (Valeur, action...)";
                        planInput.value = plan.info;
                        planInput.oninput = function() { autoResizeTextarea(this); plan.info = this.value; saveDataSilently(); };
                        planInput.onchange = () => writeToFileAPI(false);

                        planHeader.appendChild(planInput);
                        seqContent.appendChild(planHeader);
                        setTimeout(() => autoResizeTextarea(planInput), 0);

                        // Prises du plan
                        const planContent = document.createElement('div');
                        planContent.className = `acc-content take-list ${openPlan === plan.id ? 'open' : ''}`;
                        
                        const planTakes = db.takes.filter(t => t.seqId === seq.id && t.planId === plan.id);
                        if(planTakes.length === 0) {
                            planContent.innerHTML = `<div style="color: var(--text-muted); padding: 10px; font-style: italic;">Prêt à tourner...</div>`;
                        } else {
                            planTakes.forEach(take => {
                                const takeItem = document.createElement('div');
                                takeItem.className = 'take-item';
                                takeItem.innerHTML = `
                                    <div><strong>Prise ${take.prise}</strong> | ${take.avis} <br><span style="color: var(--text-muted); font-size: 0.9rem;">${take.com}</span></div>
                                    <button class="btn-delete" onclick="deleteTake(${seq.id}, ${plan.id}, ${take.prise})">❌</button>

                    const addRow = document.createElement('div');

                        <button class="btn-add" onclick="addPlan(${seq.id}, 0)">+ Plan Prévu (Fin)</button>
                        <button class="btn-add" style="color: #f5a623; border-color: #f5a623;" onclick="addPlan(${seq.id}, 1)">+ Plan Impro (Fin)</button>
                    `;
                    seqContent.appendChild(addRow);
                    container.appendChild(seqContent);
                });

            } else {
                // --- MODE TOURNAGE GLOBAL (LISTE PLATE ET ORGANISABLE) ---
                const tournageContainer = document.createElement('div');
                tournageContainer.className = 'tournage-list';

                db.tournageList.forEach((item, index) => {
                    const tItem = document.createElement('div');
                    tItem.className = `tournage-item ${item.type === 'sep' ? 'tournage-sep' : ''}`;
                    tItem.setAttribute('data-index', index);
                    
                    // --- DRAG & DROP HTML5 POUR ORDINATEUR ---
                    tItem.draggable = true;
                    tItem.ondragstart = (e) => { e.dataTransfer.setData('text/plain', index); tItem.classList.add('dragging'); };
                    tItem.ondragover = (e) => { e.preventDefault(); tItem.classList.add('drag-over'); };
                    tItem.ondragleave = (e) => { tItem.classList.remove('drag-over'); };
                    tItem.ondrop = (e) => {
                        e.preventDefault();
                        tItem.classList.remove('drag-over');
                        const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
                        if (!isNaN(fromIdx) && fromIdx !== index) {
                            const movedItem = db.tournageList.splice(fromIdx, 1)[0];
                            db.tournageList.splice(index, 0, movedItem);
                            saveDataSilently(); renderApp(); writeToFileAPI(false);
                        }
                    };
                    tItem.ondragend = () => { tItem.classList.remove('dragging'); };
                    
                    // --- DRAG & DROP TACTILE POUR MOBILE ---
                    const controls = `
                        <div class="drag-handle" title="Glisser pour déplacer"
                             ontouchstart="handleTouchStart(event, ${index})" 
                             ontouchmove="handleTouchMove(event)" 
                             ontouchend="handleTouchEnd(event)">
                            ☰
                        </div>
                    `;

                    if (item.type === 'plan') {
                        const p = db.plans.find(x => x.seqId === item.seqId && x.id === item.planId);
                        if(!p) return; // Sécurité au cas où un plan orphelin traîne
                        const takesCount = db.takes.filter(t => t.seqId === p.seqId && t.planId === p.id).length;
                        const badge = takesCount > 0 ? `<span class="take-badge">🎥 ${takesCount} prises</span>` : '';
                        
                        tItem.innerHTML = `
                            ${controls}
                            <div style="font-weight:bold; width: 120px; color: #4a90e2; cursor: pointer;" onclick="activatePlan(${p.seqId}, ${p.id})">SÉQ ${p.seqId} - P ${p.id}</div>
                            <div style="flex-grow:1; opacity:0.8; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${p.info || '...'}</div>
                            <input type="text" class="header-input" style="width: 90px; margin:0;" placeholder="Temps..." value="${p.temps || ''}" onchange="updatePlanTemps(${p.seqId}, ${p.id}, this.value)">
                            ${badge}
                        `;
                    } else if (item.type === 'sep') {
                        tItem.innerHTML = `
                            ${controls}
                            <div style="font-weight:bold; color:#f5a623;">SÉPARATEUR</div>
                            <input type="text" class="header-input" style="flex-grow:1; margin:0;" placeholder="Ex: Lundi Matin..." value="${item.text || ''}" onchange="updateGlobalSepText(${index}, this.value)">
                            <button class="btn-icon" onclick="deleteGlobalSep(${index})">❌</button>
                        `;
                    }
                    tournageContainer.appendChild(tItem);
                });
                
                const btnAddSep = document.createElement('button');
                btnAddSep.className = 'btn-add';
                btnAddSep.style.marginTop = '10px';
                btnAddSep.innerText = '+ Ajouter un Séparateur (Planning)';
                btnAddSep.onclick = () => addGlobalSeparator();
                tournageContainer.appendChild(btnAddSep);

                container.appendChild(tournageContainer);
            }

            updateDashboard();
        }

        function updateDashboard() {
            const board = document.getElementById('statusBoard');
            const controls = document.getElementById('takeControls');
            
            if (activeSeq !== null && activePlan !== null) {
                const nextTake = db.takes.filter(t => t.seqId === activeSeq && t.planId === activePlan).length + 1;
                board.className = 'status-board';
                board.innerHTML = `SÉQ ${activeSeq} | PLAN ${activePlan} | <span style="color:var(--text-main);">PRISE ${nextTake}</span>`;
                controls.style.display = 'grid';
            } else {
                board.className = 'status-board inactive';
                board.innerHTML = `SÉLECTIONNEZ UN PLAN<br>POUR TOURNER`;
                controls.style.display = 'none';
            }
        }

        // --- NAVIGATION & GESTION NUMÉROTATION ---
        function toggleSeq(seqId) { openSeq = (openSeq === seqId) ? null : seqId; renderApp(); }
        function activatePlan(seqId, planId) { openSeq = seqId; openPlan = (openPlan === planId && activePlan === planId) ? null : planId; activeSeq = seqId; activePlan = planId; renderApp(); }
        
        function editSeqId(oldId, event) {
            if(event) event.stopPropagation(); // Évite de plier/déplier l'accordéon
            const newIdStr = prompt(`Modifier le numéro de la Séquence ${oldId} :`, oldId);
            if(!newIdStr) return;
            const newId = parseInt(newIdStr);
            if(isNaN(newId) || newId <= 0) return alert("Numéro invalide.");
            if(newId === oldId) return;
            if(db.sequences.some(s => s.id === newId)) return alert("Ce numéro de séquence existe déjà.");

            // Mise à jour de l'ID partout dans la base
            db.sequences.find(s => s.id === oldId).id = newId;
            db.plans.filter(p => p.seqId === oldId).forEach(p => p.seqId = newId);
            db.takes.filter(t => t.seqId === oldId).forEach(t => t.seqId = newId);
            db.tournageList.filter(i => i.type === 'plan' && i.seqId === oldId).forEach(i => i.seqId = newId);

            db.sequences.sort((a,b) => a.id - b.id);
            
            if (openSeq === oldId) openSeq = newId;
            if (activeSeq === oldId) activeSeq = newId;

            saveDataSilently(); renderApp(); writeToFileAPI(false);
        }

        // --- GESTION DU PLAN DE TRAVAIL GLOBAL ---
        function updatePlanTemps(seqId, planId, val) { const p = db.plans.find(x => x.seqId === seqId && x.id === planId); if(p) { p.temps = val; saveDataSilently(); writeToFileAPI(false); } }
        function addGlobalSeparator() { db.tournageList.push({type: 'sep', text: ''}); saveDataSilently(); renderApp(); writeToFileAPI(false); }
        function updateGlobalSepText(index, val) { if(db.tournageList[index]) { db.tournageList[index].text = val; saveDataSilently(); writeToFileAPI(false); } }
        function deleteGlobalSep(index) { db.tournageList.splice(index, 1); saveDataSilently(); renderApp(); writeToFileAPI(false); }

        // --- CRUD SÉQUENCES ---
        async function addSequence() {
            await requireProjectName();
            const newSeqId = db.sequences.length > 0 ? Math.max(...db.sequences.map(s => s.id)) + 1 : 1;
            db.sequences.push({ id: newSeqId, info: "" });
            openSeq = newSeqId;
            saveDataSilently(); renderApp(); await writeToFileAPI(true);
        }

        async function insertSeqBefore(targetSeqId) {
            await requireProjectName();
            db.sequences.filter(s => s.id >= targetSeqId).forEach(s => s.id++);
            db.plans.filter(p => p.seqId >= targetSeqId).forEach(p => p.seqId++);
            db.takes.filter(t => t.seqId >= targetSeqId).forEach(t => t.seqId++);
            db.tournageList.forEach(item => { if(item.type === 'plan' && item.seqId >= targetSeqId) item.seqId++; });

            db.sequences.push({ id: targetSeqId, info: "" });
            db.sequences.sort((a,b) => a.id - b.id);

            if (openSeq >= targetSeqId) openSeq++;
            if (activeSeq >= targetSeqId) activeSeq++;
            openSeq = targetSeqId;
            saveDataSilently(); renderApp(); await writeToFileAPI(true);
        }

        async function deleteSeq(seqId) {
            if(!confirm(`⚠️ SUPPRIMER LA SÉQUENCE ${seqId} ? (Tous ses plans seront effacés)`)) return;
            db.sequences = db.sequences.filter(s => s.id !== seqId);
            db.plans = db.plans.filter(p => p.seqId !== seqId);
            db.takes = db.takes.filter(t => t.seqId !== seqId);
            db.tournageList = db.tournageList.filter(item => !(item.type === 'plan' && item.seqId === seqId));

            if(openSeq === seqId) openSeq = null; 
            if(activeSeq === seqId) { activeSeq = null; activePlan = null; } 

            saveDataSilently(); renderApp(); await writeToFileAPI(true);
        }

        // --- CRUD PLANS ---
        async function addPlan(seqId, isImpro) {
            await requireProjectName();
            const seqPlans = db.plans.filter(p => p.seqId === seqId);
            const newPlanId = seqPlans.length > 0 ? Math.max(...seqPlans.map(p => p.id)) + 1 : 1;
            
            db.plans.push({ seqId: seqId, id: newPlanId, impro: isImpro, info: "", temps: "" });
            db.tournageList.push({ type: 'plan', seqId: seqId, planId: newPlanId });

            activatePlan(seqId, newPlanId);
            saveDataSilently(); await writeToFileAPI(true);
        }

        async function insertPlanBefore(seqId, targetPlanId) {
            await requireProjectName();
            db.plans.filter(p => p.seqId === seqId && p.id >= targetPlanId).forEach(p => p.id++);
            db.takes.filter(t => t.seqId === seqId && t.planId >= targetPlanId).forEach(t => t.planId++);

            db.plans.push({ seqId: seqId, id: targetPlanId, impro: 0, info: "", temps: "" });
            db.plans.sort((a,b) => a.id - b.id);

            db.tournageList.forEach(item => { if(item.type === 'plan' && item.seqId === seqId && item.planId >= targetPlanId) item.planId++; });
            
            // Cherche le point d'insertion dans la liste de tournage pour rester cohérent
            const idx = db.tournageList.findIndex(item => item.type === 'plan' && item.seqId === seqId && item.planId === targetPlanId + 1);
            if(idx !== -1) db.tournageList.splice(idx, 0, { type: 'plan', seqId: seqId, planId: targetPlanId });
            else db.tournageList.push({ type: 'plan', seqId: seqId, planId: targetPlanId });

            if(openSeq === seqId && openPlan >= targetPlanId) openPlan++;
            if(activeSeq === seqId && activePlan >= targetPlanId) activePlan++;
            
            activatePlan(seqId, targetPlanId);
            saveDataSilently(); await writeToFileAPI(true);
        }

        async function deletePlan(seqId, planId) {
            if(!confirm(`⚠️ SUPPRIMER LE PLAN ${planId} ?`)) return;
            db.plans = db.plans.filter(p => !(p.seqId === seqId && p.id === planId));
            db.takes = db.takes.filter(t => !(t.seqId === seqId && t.planId === planId));
            db.tournageList = db.tournageList.filter(item => !(item.type === 'plan' && item.seqId === seqId && item.planId === planId));

            if(openSeq === seqId && openPlan === planId) openPlan = null; 
            if(activeSeq === seqId && activePlan === planId) { activePlan = null; }

            saveDataSilently(); renderApp(); await writeToFileAPI(true);
        }

        // --- CRUD PRISES ---
        async function saveTake() {
            if(activeSeq === null || activePlan === null) return;
            await requireProjectName();
            const avis = document.getElementById('avis').value;
            const com = document.getElementById('com').value;
            const nextTake = db.takes.filter(t => t.seqId === activeSeq && t.planId === activePlan).length + 1;
            const timestamp = new Date().toISOString(); 
            
            db.takes.push({ 
                seqId: activeSeq, 
                planId: activePlan, 
                prise: nextTake, 
                avis: avis, 
                com: com,
                timestamp: timestamp
            });
            
            document.getElementById('com').value = '';
            openPlan = activePlan; 
            
            saveDataSilently(); renderApp(); await writeToFileAPI(true);
        }

        async function deleteTake(seqId, planId, priseNum) {
            if(!confirm(`Supprimer la Prise ${priseNum} ?`)) return;
            db.takes = db.takes.filter(t => !(t.seqId === seqId && t.planId === planId && t.prise === priseNum));
            let planTakes = db.takes.filter(t => t.seqId === seqId && t.planId === planId);
            planTakes.sort((a, b) => a.prise - b.prise);
            planTakes.forEach((t, index) => { t.prise = index + 1; });
            saveDataSilently(); renderApp(); await writeToFileAPI(true);
        }

        // --- FICHIERS ET SAUVEGARDE CSV ---
        function saveDataSilently() { localStorage.setItem('kinoDB_v2', JSON.stringify(db)); }

        function generateCSV() {
            let csv = "\uFEFF"; 
            csv += "--- PROJECT ---\n" + (db.projectName || "Kino") + "\n";
            
            csv += "--- SEQUENCES ---\nseqId;info\n";
            db.sequences.forEach(s => { csv += `${s.id};${s.info.replace(/;/g, ",").replace(/\n/g, " ")}\n`; });
            
            // Format globalisé pour le mode tournage
            csv += "--- TOURNAGE_LIST ---\ntype;seqId;planId;text\n";
            db.tournageList.forEach(item => {
                csv += `${item.type};${item.seqId || ''};${item.planId || ''};${(item.text || '').replace(/;/g, ",")}\n`;
            });
            
            csv += "--- PLANS ---\nseqId;planId;impro;info;temps\n";
            db.plans.forEach(p => { csv += `${p.seqId};${p.id};${p.impro};${p.info.replace(/;/g, ",").replace(/\n/g, " ")};${p.temps || ''}\n`; });
            
            csv += "--- TAKES ---\nseqId;planId;priseId;avis;com;timestamp\n";
            db.takes.forEach(t => { 
                let safeCom = t.com ? t.com.replace(/;/g, ",").replace(/\n/g, " ") : "";
                let safeTime = t.timestamp ? t.timestamp : "";
                csv += `${t.seqId};${t.planId};${t.prise};${t.avis};${safeCom};${safeTime}\n`; 
            });
            
            return csv;
        }

        async function writeToFileAPI(requireUserGesture = false) {
            if (!window.showSaveFilePicker) return; 
            if (!fileHandle) {
                if (!requireUserGesture) return; 
                try {
                    fileHandle = await window.showSaveFilePicker({
                        suggestedName: getFileName() + '.csv',
                        types: [{ description: 'Fichier CSV Kino', accept: {'text/csv': ['.csv']} }],
                    });
                } catch (err) { return; }
            }
            try {
                const writable = await fileHandle.createWritable();
                await writable.write(generateCSV());
                await writable.close();
            } catch(e) { console.error("Erreur d'écriture :", e); }
        }

        async function exportCSV() {
            await requireProjectName();
            const csvContent = generateCSV();
            if (window.showSaveFilePicker) {
                try {
                    fileHandle = await window.showSaveFilePicker({
                        suggestedName: getFileName() + '.csv',
                        types: [{ description: 'Fichier CSV', accept: {'text/csv': ['.csv']} }],
                    });
                    const writable = await fileHandle.createWritable();
                    await writable.write(csvContent);
                    await writable.close();
                    alert("✅ Fichier lié ! Les prochaines modifications s'enregistreront en direct.");
                } catch (err) {}
            } else {
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", getFileName() + '.csv');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                let content = e.target.result;
                if(content.charCodeAt(0) === 0xFEFF) content = content.substring(1);
                
                db = { projectName: "", sequences: [], plans: [], takes: [], tournageList: [] };
                
                let currentSection = "";
                const lines = content.split(/\r?\n/);
                
                for(let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if(line === "") continue;
                    
                    if(line.startsWith("--- PROJECT ---")) { currentSection = "PROJECT"; continue; }
                    if(line.startsWith("--- SEQUENCES ---")) { currentSection = "SEQUENCES"; i++; continue; }
                    if(line.startsWith("--- TOURNAGE_LIST ---")) { currentSection = "TOURNAGE"; i++; continue; }
                    if(line.startsWith("--- PLANS ---")) { currentSection = "PLANS"; i++; continue; }
                    if(line.startsWith("--- TAKES ---")) { currentSection = "TAKES"; i++; continue; }
                    
                    if(currentSection === "PROJECT") { db.projectName = line; }
                    
                    const cols = line.split(';');
                    if(currentSection === "SEQUENCES" && cols.length >= 2) {
                        db.sequences.push({ id: parseInt(cols[0]), info: cols[1] });
                    }
                    if(currentSection === "TOURNAGE" && cols.length >= 4) {
                        // Rétrocompatibilité : différencie l'ancien format (seqId;type;...) du nouveau (type;seqId;...)
                        if (cols[1] === 'plan' || cols[1] === 'sep') {
                            db.tournageList.push({ type: cols[1], seqId: parseInt(cols[0]) || null, planId: parseInt(cols[2]) || null, text: cols[3] });
                        } else {
                            db.tournageList.push({ type: cols[0], seqId: parseInt(cols[1]) || null, planId: parseInt(cols[2]) || null, text: cols[3] });
                        }
                    }
                    if(currentSection === "PLANS" && cols.length >= 4) {
                        db.plans.push({ seqId: parseInt(cols[0]), id: parseInt(cols[1]), impro: parseInt(cols[2])||0, info: cols[3], temps: cols[4]||"" });
                    }
                    if(currentSection === "TAKES" && cols.length >= 5) {
                        db.takes.push({ 
                            seqId: parseInt(cols[0]), 
                            planId: parseInt(cols[1]), 
                            prise: parseInt(cols[2]), 
                            avis: cols[3], 
                            com: cols[4],
                            timestamp: cols[5] || ""
                        });
                    }
                }
                
                saveDataSilently();
                openSeq = db.sequences.length > 0 ? db.sequences[0].id : null;
                openPlan = null; activeSeq = null; activePlan = null; viewMode = 'decoupage';
                renderApp();
                fileHandle = null;
                alert("✅ Projet chargé avec succès !");
                event.target.value = "";
            };
            reader.readAsText(file);
        }

        function resetCache() {
            if(confirm("⚠️ Attention, cela va vider tout le découpage actuel. Pensez à exporter ! Continuer ?")) {
                localStorage.removeItem('kinoDB_v2');
                db = { projectName: "", sequences: [{ id: 1, info: "" }], plans: [{ seqId: 1, id: 1, impro: 0, info: "", temps: "" }], takes: [], tournageList: [{type: 'plan', seqId: 1, planId: 1}] };
                openSeq = 1; openPlan = null; activeSeq = null; activePlan = null; viewMode = 'decoupage';
                fileHandle = null; saveDataSilently(); renderApp();
            }
        }
        
        // --- LANCEMENT SERVICE WORKER ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('Service Worker enregistré avec succès.', registration.scope);
                    })
                    .catch(err => {
                        console.error('Erreur Service Worker:', err);
                    });
            });
        }

        // --- GESTION DU DRAG & DROP MOBILE (TOUCH) ---
        let draggedIndex = null;
        let touchEl = null;
        let placeholder = null;

        function handleTouchStart(e, index) {
            draggedIndex = index;
            touchEl = e.target.closest('.tournage-item');
            
            const rect = touchEl.getBoundingClientRect();
            
            // Création d'un espace vide pour garder la mise en page
            placeholder = document.createElement('div');
            placeholder.className = 'tournage-item placeholder';
            placeholder.style.height = rect.height + 'px';
            touchEl.parentNode.insertBefore(placeholder, touchEl);
            
            // On décolle l'élément visuellement
            touchEl.style.position = 'fixed';
            touchEl.style.zIndex = '9999';
            touchEl.style.width = rect.width + 'px';
            touchEl.style.top = rect.top + 'px';
            touchEl.style.left = rect.left + 'px';
            touchEl.style.boxShadow = '0 10px 25px rgba(0,0,0,0.5)';
            touchEl.style.pointerEvents = 'none'; // Permet de "voir" à travers
            touchEl.style.transition = 'none';
            
            document.body.style.overflow = 'hidden'; // Bloque le scroll
        }

        function handleTouchMove(e) {
            if(draggedIndex === null) return;
            e.preventDefault(); 
            const y = e.touches[0].clientY;
            
            // L'élément suit le doigt
            touchEl.style.top = (y - (touchEl.offsetHeight / 2)) + 'px';
            
            // Trouve ce qui se trouve sous le doigt
            const target = document.elementFromPoint(e.touches[0].clientX, y);
            
            if(target) {
                const targetItem = target.closest('.tournage-item:not(.placeholder)');
                document.querySelectorAll('.tournage-item').forEach(el => el.classList.remove('drag-over'));
                if(targetItem) targetItem.classList.add('drag-over');
            }
        }

        function handleTouchEnd(e) {
            if(draggedIndex === null) return;
            document.body.style.overflow = '';
            
            const y = e.changedTouches[0].clientY;
            const target = document.elementFromPoint(e.changedTouches[0].clientX, y);
            
            if(target) {
                const targetItem = target.closest('.tournage-item:not(.placeholder)');
                if(targetItem) {
                    const dropIndex = parseInt(targetItem.getAttribute('data-index'));
                    if(!isNaN(dropIndex) && dropIndex !== draggedIndex) {
                        const item = db.tournageList.splice(draggedIndex, 1)[0];
                        db.tournageList.splice(dropIndex, 0, item);
                        saveDataSilently();
                        writeToFileAPI(false);
                    }
                }
            }
            
            draggedIndex = null;
            touchEl = null;
            if(placeholder) { placeholder.remove(); placeholder = null; }
            renderApp(); // Recharge la vue et nettoie tous les styles en ligne
        }
    </script>
</body>
</html>
